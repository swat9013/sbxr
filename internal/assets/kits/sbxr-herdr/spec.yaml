# herdr 連携 (ADR 0007) の VM 側。sandbox VM の起動ごとに走る。env 定義は herdr 連携が有効なときだけこの kit を入れる。
# herdr は認証の要らない GitHub release の URL から取る (secret の要求に依存しない。宛先は default の egress の github group)。
schemaVersion: "2"
name: sbxr-herdr
kind: mixin
description: herdr を導入し、server を起動して Claude Code の integration を入れる

args:
  version:
    required: true
    description: 導入する herdr の release tag (herdrdev/herdr)
  worktree:
    required: true
    description: VM 内の作業ツリーの path。herdr の pane をここから始める (decision/0014)。単一引用符・制御文字・UTF-8 でない byte は含まない (sbxr が確かめる)

setup:
  # 各段は失敗しても 0 で終わり、"sbxr-herdr: fail <段>" を log に残す (理由は ADR 0007)。create 時は sbxr がこの行を失敗として読む。
  startup:
    - description: herdr を導入する (宣言の版と違うか未導入のときだけ)
      command:
        - bash
        - -c
        - |
          want='${{ kit.args.version }}'
          if command -v herdr >/dev/null && [ "$(herdr --version 2>/dev/null)" = "herdr ${want#v}" ]; then
            exit 0
          fi
          if ! (
            set -euo pipefail
            dir="$(mktemp -d)"
            curl -fsSL -o "$dir/herdr" "https://github.com/herdrdev/herdr/releases/download/$want/herdr-linux-$(uname -m)"
            sudo install -m 0755 "$dir/herdr" /usr/local/bin/herdr
            # herdr machine add は VM の ~/.local/bin/herdr を検査するので、同じ binary を置く
            mkdir -p "$HOME/.local/bin"
            install -m 0755 "$dir/herdr" "$HOME/.local/bin/herdr"
          ); then
            echo "sbxr-herdr: fail install $want"
          fi
    - description: herdr の pane・tab・workspace を --cwd なしで作ったときの起点を VM 内の作業ツリーにする (server が起動時に読む)
      command:
        - bash
        - -c
        - |
          # この file は sbxr が持つ。起動ごとに書き直す
          wt='${{ kit.args.worktree }}'
          # 作業ツリーは VM の起動時の startup より前に置かれる (clone 方式の create の初回 boot で実測)
          [ -d "$wt" ] || echo "sbxr-herdr: fail worktree ($wt が無い)"
          esc=${wt//\\/\\\\}
          esc=${esc//\"/\\\"}
          if ! (
            set -euo pipefail
            mkdir -p "$HOME/.config/herdr"
            printf '[terminal]\nnew_cwd = "%s"\n' "$esc" > "$HOME/.config/herdr/config.toml"
          ); then
            echo "sbxr-herdr: fail config"
          fi
    - description: herdr server を VM 内の作業ツリーから起動する (起動時の workspace がそこで始まる)
      command:
        - bash
        - -c
        - |
          # 作業ツリーに入れなくても既定の cwd で起動する (herdr は使えるようにし、入れなかったことは fail 行で残す)
          cd '${{ kit.args.worktree }}' || echo "sbxr-herdr: fail worktree (server を既定の cwd で起動する)"
          exec herdr server
      background: true
    - description: Claude Code の integration を入れる (server が動いてから)
      command:
        - bash
        - -c
        - |
          running=no
          for _ in $(seq 1 30); do
            if herdr status --json 2>/dev/null | grep -q '"running": *true'; then
              running=yes
              break
            fi
            sleep 1
          done
          if [ "$running" = no ]; then
            echo "sbxr-herdr: fail server (herdr status が 30 秒で running にならない)"
            exit 0
          fi
          herdr integration install claude || echo "sbxr-herdr: fail integration"
