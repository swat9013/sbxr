# default スコープの宣言 (CLI に同梱)。user 設定 (~/.config/sbxr/config.yaml) と
# repo 宣言 (<repo>/sbxr.yaml) がこの上に重なる。個人値 (git identity・言語・plugin 選定) は持たない。
version: 1

# agent runtime profile: VM 内の Claude Code の settings.json へ入る key だけを持つ
profile:
  model: opus
  effortLevel: medium
  # sandbox VM の agent は非対話なので、対話補助と背景のモデル呼び出しは待ち時間を増やすだけ。まとめて切る
  awaySummaryEnabled: false      # 離席後に出る session recap の生成
  autoMemoryEnabled: false       # auto-memory directory の毎ターン read/write
  autoDreamEnabled: false        # background の memory consolidation
  promptSuggestionEnabled: false # 入力欄の prompt 候補生成
  spinnerTipsEnabled: false      # spinner の tips 表示
  feedbackDrafts: "off"          # SendFeedback tool ごと外す
  env:
    CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "60"
    CLAUDE_BASH_MAINTAIN_PROJECT_WORKING_DIR: "1"
    CLAUDE_CODE_ENABLE_TODO_TOOLS: "1"
    DISABLE_ERROR_REPORTING: "1"
  # VM の Claude Code は marketplace を持たずに起動するので、plugin install の前提になる official marketplace を宣言する
  extraKnownMarketplaces:
    claude-plugins-official:
      source:
        source: github
        repo: anthropics/claude-plugins-official

# 全 sandbox VM に常時適用する汎用の宛先グループ (global rule)。user 設定で group を足すか、
# 同じ名前の group に enabled: false を書いて除外する。repo 固有の宛先は repo 宣言に書く (sandbox スコープ rule)
egress:
  github:
    rationale: git の push / fetch、gh api、GitHub releases からのツール導入、plugin marketplace の取得、ghcr の image
    allow:
      - github.com:443
      - "**.github.com:443"
      - "**.githubusercontent.com:443"
      - ghcr.io:443
  mise-tools:
    rationale: mise 経由の言語ツールチェーンの導入元 (npm・Go・uv / Python)。registry 解決の主経路の GitHub releases は github group が担う
    allow:
      - mise.run:443
      - mise-versions.jdx.dev:443
      - registry.npmjs.org:443
      - dl.google.com:443
      - astral.sh:443
      - pypi.org:443
      - files.pythonhosted.org:443
  docker-registry:
    rationale: VM 内の docker daemon の image pull (Docker Hub の registry・auth・CDN) と docker CE の導入元
    allow:
      - docker.io:443
      - "**.docker.io:443"
      - production.cloudflare.docker.com:443
      - download.docker.com:443
  ubuntu-apt:
    rationale: VM (Ubuntu aarch64) の apt。叩くのは ports.ubuntu.com だけで、80 は apt の既定経路
    allow:
      - ports.ubuntu.com:443
      - ports.ubuntu.com:80
  cert-validation:
    rationale: TLS の OCSP / CRL / CA 配布。塞ぐと HTTPS の証明書検証が壊れる
    allow:
      - "**.lencr.org:80"
      - "**.lencr.org:443"
      - ocsp.digicert.com:80
      - crl*.digicert.com:80
      - cacerts.digicert.com:80
      - "*.one.digicert.com:80"
      - "*.one.au.digicert.com:80"
      - "*.one.ch.digicert.com:80"
      - "*.one.nl.digicert.com:80"
      - "*.one.digicert.co.jp:80"
      - ocsp.sectigo.com:80
      - crl.sectigo.com:80
      - crt.sectigo.com:80
      - ocsp.comodoca.com:80
      - crl.comodoca.com:80
      - ocsp.usertrust.com:80
      - crl.usertrust.com:80
      - "**.pki.goog:80"
      - "**.pki.goog:443"
      - "**.amazontrust.com:80"
      - "**.amazontrust.com:443"
      - isrg.trustid.ocsp.identrust.com:80
      - "**.pki.microsoft.com:80"
      - "**.pki.microsoft.com:443"
      - crl.globalsign.com:80
      - crl.globalsign.net:80
      - ocsp.globalsign.com:80
      - ocsp.globalsign.com:443
      - ocsp2.globalsign.com:80
      - ocsp2.globalsign.com:443

# secret 定義。値は secret ファイル (~/.config/sbxr/secrets.env) の key から読み、VM には placeholder だけが入る。
# 配線するのは user 設定か repo 宣言の secrets で要求され、hosts がすべて egress で許可されているときだけ
secret_defs:
  github:
    service: github # sbx 組み込みの github service。VM の gh / git が使う token を proxy が差し込む
    key: GITHUB_TOKEN
    hosts:
      - github.com
      - api.github.com

# herdr 連携 (ADR 0007)。user 設定で enabled: true にすると、VM に herdr を入れ、host の herdr に machine を登録する。
# repo 宣言は書けない。version は動作を確かめた release
herdr:
  enabled: false
  version: v0.9.0
