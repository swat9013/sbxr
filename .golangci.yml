version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - errorlint
    - exhaustive
    - nolintlint
  settings:
    exhaustive:
      # 外部 package の enum は値を全部並べても網羅の意味が無い。外部の enum の switch が指摘されたら、この正規表現に足す
      ignore-enum-types: '^(go\.yaml\.in/yaml/v3|reflect)\.Kind$'
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/swat9013/sbxr
